  - platform: template
    name: "7.16通道总功率"
    id: total_power_combined
    icon: "mdi:flash"
    device_class: power
    unit_of_measurement: "W"
    accuracy_decimals: 2
    lambda: return id(bl0906_power_sum).state + id(bl0910_power_sum).state;
    web_server:
      sorting_group_id: basic_sensors
    update_interval: 10s
  - platform: template
    name: "8.16通道总电量"
    device_class: energy
    state_class: total_increasing
    id: total_energy_combined
    icon: "mdi:flash"
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    lambda: return id(bl0906_energy_sum).state + id(bl0910_energy_sum).state;
    web_server:
      sorting_group_id: basic_sensors
    update_interval: 10s
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${name} WiFi dB"
    id: wifi_signal_db
    icon: mdi:signal-variant
    update_interval: 60s
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${name} WiFi Percent"
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    web_server:
      sorting_group_id: diagnostic
switch:
  - platform: restart
    name: "${name}重启"
    web_server:
      sorting_group_id: diagnostic
  - platform: factory_reset
    name: "${name}恢复出厂设置"
    web_server:
      sorting_group_id: diagnostic

time:
  - platform: sntp
    id: my_time
    servers: 
      - ntp1.aliyun.com
      - ntp1.ntsc.ac.cn
      - 0.pool.ntp.org

text_sensor:
  - platform: wifi_info
    ip_address:
