button:
  # BL0906（11-16通道）
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    function: diagnose_persistence
    name: "1.检查电量持久化数据BL0906"
    web_server:
      sorting_group_id: diagnostic
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    function: diagnose_statistics
    name: "2.检查电量统计数据BL0906"
    web_server:
      sorting_group_id: diagnostic
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    function: save_energy
    name: "3.立即保存电量数据BL0906"
    web_server:
      sorting_group_id: diagnostic
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
