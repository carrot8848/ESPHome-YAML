      web_server:
        sorting_group_id: diagnostic
    bssid:
      name: ${name} Connected BSSID
      icon: mdi:router-wireless
      web_server:
        sorting_group_id: diagnostic
    mac_address:
      name: ${name} Mac Wifi Address
      icon: mdi:folder-key-network
