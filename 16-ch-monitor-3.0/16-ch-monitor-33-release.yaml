substitutions:
  name: "16-ch-monitor-v3_3"
  friendly_name: "16通道电量计量模块v3.3"
  ch1: "ch_01"   #可根据需要修改名称
  ch2: "ch_02"   #可根据需要修改名称
  ch3: "ch_03"    #可根据需要修改名称
  ch4: "ch_04"    #可根据需要修改名称
  ch5: "ch_05"  #可根据需要修改名称
  ch6: "ch_06"     #可根据需要修改名称
  ch7: "ch_07"     #可根据需要修改名称
  ch8: "ch_08"     #可根据需要修改名称
  ch9: "ch_09"     #可根据需要修改名称
  ch10: "ch_10"     #可根据需要修改名称
  ch11: "ch_11"   #可根据需要修改名称
  ch12: "ch_12"   #可根据需要修改名称
  ch13: "ch_13"    #可根据需要修改名称
  ch14: "ch_14"    #可根据需要修改名称
  ch15: "ch_15"  #可根据需要修改名称
  ch16: "ch_16"     #可根据需要修改名称
esphome:
  name: "${name}"
  name_add_mac_suffix: True
  friendly_name: "${friendly_name}"
  min_version: 2026.8.0
  project: 
    name: "carrot8848.16-ch-monitor"
    version: "3.3"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(sensor_bl0906)->set_update_interval(static_cast<uint32_t>(id(bl0906_update_interval).state * 1000));
          id(sensor_bl0906).start_poller();
          id(sensor_bl0910)->set_update_interval(static_cast<uint32_t>(id(bl0906_update_interval).state * 1000));
          id(sensor_bl0910).start_poller();
preferences:
  flash_write_interval: 2min
esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
    # advanced: 
    #   enable_ota_rollback: false
# Enable logging
logger:
  hardware_uart: UART0
  level: DEBUG
  logs:
    sensor: WARN
  #   mqtt.component: WARN
  #   mqtt.client: ERROR

# Enable Home Assistant API
api:

ota:
  - platform: esphome
  
wifi:
  # ssid: !secret wifi_ssid
  # password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    # ssid: "${name}"
    # password: ""

captive_portal:

web_server:
  port: 80
  version: 3
  # 深度定制：自研仪表盘（energy_dashboard.*，6/10/16/3x6 通道通用）整体替换官方 v3 通用页面，编译进固件离线可用
  # 注意：不能开 local: True —— local 模式设备直接返回内嵌官方页面，css/js include 完全不生效
  css_url: ""   # 置空 = 不加载官方样式
  js_url: ""    # 置空 = 不加载官方前端脚本（<esp-app> 不注册，页面由我们的 js 构建）
  css_include: ../web-server-ui/energy_dashboard.css
  js_include: ../web-server-ui/energy_dashboard.js
  sorting_groups:
    - id: basic_sensors
      name: "基础传感器"
      sorting_weight: 10
    - id: current
      name: "电流"
      sorting_weight: 20
    - id: power
      name: "功率"
      sorting_weight: 30
    - id: energy
      name: "电量"
      sorting_weight: 40
    - id: sum_sensor
      name: "通道总和"
      sorting_weight: 11
    - id: today_energy
      name: "今日电量"
      sorting_weight: 50
    - id: yesterday_energy
      name: "昨日电量"
      sorting_weight: 51
    - id: week_energy
      name: "本周电量"
      sorting_weight: 52
    - id: month_energy
      name: "本月电量"
      sorting_weight: 53
    - id: year_energy
      name: "今年电量"
      sorting_weight: 54
    - id: miscellaneous
      name: "其它"
      sorting_weight: 60
    - id: diagnostic
      name: "诊断"
      sorting_weight: 70

external_components:
  - source:
      type: git
      url: https://github.com/carrot8848/bl0906_carrot8848
      ref: main
    components: [bl0906_carrot8848]
    refresh: 0s
status_led:
  pin: 
    number: 0
    inverted: true

spi:
  - id: spi_bus
    mosi_pin: 19
    miso_pin: 3
    clk_pin: 18
i2c:
  - id: i2c_bus
    sda: 4
    scl: 5
    scan: true
    frequency: 400kHz

bl0906_carrot8848:
  - id: sensor_bl0906
    chip_model: bl0906
    spi_id: spi_bus
    cs_pin: 1
    update_interval: 10s
    energy_statistics: true
    time_id: my_time
    instance_id: 0x906B0001
    eeprom_type: 24c04
    i2c_id: i2c_bus
    address: 0x50
  - id: sensor_bl0910
    chip_model: bl0910
    spi_id: spi_bus
    cs_pin: 2
    update_interval: 10s
    energy_statistics: true
    time_id: my_time
    instance_id: 0x910B0001
    eeprom_type: 24c04
    i2c_id: i2c_bus
    address: 0x50
sensor:
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    # 全局传感器
    frequency:
      name: '1.BL0906频率'
      web_server:
          sorting_group_id: basic_sensors
    temperature:
      name: '2.BL0906温度'
      web_server:
          sorting_group_id: basic_sensors
    voltage:
      name: '3.BL0906电压'
      id: bl0906_voltage
      accuracy_decimals: 1
      web_server:
          sorting_group_id: basic_sensors
    # 总和传感器
    power_sum:
      name: "13.11-16通道总功率"
      id: bl0906_power_sum
      web_server:
          sorting_group_id: sum_sensor
    energy_sum:
      name: "14.11-16通道总电量"
      id: bl0906_energy_sum
      web_server:
          sorting_group_id: sum_sensor
      accuracy_decimals: 2
      unit_of_measurement: kWh
    # 总电量统计传感器
    today_total_energy:
      name: "06.11-16通道今日总电量"
      unit_of_measurement: kWh
      device_class: energy
      accuracy_decimals: 2
      web_server:
          sorting_group_id: sum_sensor
    yesterday_total_energy:
      name: "07.11-16通道昨日总电量"
      unit_of_measurement: kWh
      device_class: energy
      accuracy_decimals: 2
      web_server:
          sorting_group_id: sum_sensor
    week_total_energy:
