    icon: "mdi:restart"
    web_server:
      sorting_group_id: diagnostic
number:
  - platform: template
    name: "传感器更新间隔"
    id: bl0906_update_interval
    unit_of_measurement: s
    icon: "mdi:timer"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 10
    restore_value: True
    optimistic: True
    set_action:
      lambda: |-
        id(sensor_bl0906)->set_update_interval(static_cast<uint32_t>(x * 1000));
        id(sensor_bl0906).start_poller();              // 重启轮询器使新间隔生效
        id(sensor_bl0910)->set_update_interval(static_cast<uint32_t>(x * 1000));
        id(sensor_bl0910).start_poller();              // 重启轮询器使新间隔生效
    web_server:
      sorting_group_id: diagnostic