  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${name} WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    web_server:
        sorting_group_id: diagnostic
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${name} WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    web_server:
        sorting_group_id: diagnostic
    entity_category: "diagnostic"

switch:
  - platform: restart
    name: "${name} 重启"
    web_server:
        sorting_group_id: diagnostic
  - platform: factory_reset
    name: "${name} 恢复出厂设置"
    web_server:
        sorting_group_id: diagnostic

time:
  - platform: sntp
    id: my_time
    servers:
      - ntp1.aliyun.com
      - ntp1.ntsc.ac.cn
      - 0.pool.ntp.org
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${name} IP Address"
      web_server:
        sorting_group_id: diagnostic
    ssid:
      name: "${name} Connected SSID"
      web_server:
        sorting_group_id: diagnostic
    bssid:
      name: "${name} Connected BSSID"
      web_server:
        sorting_group_id: diagnostic
    mac_address:
      name: "${name} Mac Wifi Address"
      web_server:
        sorting_group_id: diagnostic
    # scan_results:
    #   name: Energy_meter Latest Scan Results
    dns_address:
      name: "${name} DNS Address"
      web_server:
        sorting_group_id: diagnostic
  - platform: version
    name: "ESPHome Version"
    icon: mdi:new-box
    web_server:
        sorting_group_id: "diagnostic"
  - platform: template
    name: "ESPHome Project Version"
    id: esphome_project_version_text_short
    icon: "mdi:information-box"
    entity_category: "diagnostic"
    update_interval: 600s
    lambda: |-
      return { ESPHOME_PROJECT_VERSION };
    web_server:
        sorting_group_id: "diagnostic"
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    calibration_status:
      name: "${name} Calibration Status"
      web_server:
        sorting_group_id: diagnostic
button:
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    function: diagnose_persistence
    name: "1.检查电量持久化数据"
    web_server:
      sorting_group_id: diagnostic
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    function: reset_energy
    name: "4.清空电量信息"
    icon: "mdi:restart"
    web_server:
      sorting_group_id: diagnostic
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    function: save_energy
    name: "3.立即保存电量数据"
    web_server:
      sorting_group_id: diagnostic
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906
    function: diagnose_statistics
    name: "2.检查电量统计数据"
    web_server:
      sorting_group_id: diagnostic
number:
  - platform: template
    name: "传感器更新间隔"
    id: bl0906_update_interval
    unit_of_measurement: s
    icon: "mdi:timer"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 10
    restore_value: True
    optimistic: True
    set_action:
      lambda: |-
        id(sensor_bl0906)->set_update_interval(static_cast<uint32_t>(x * 1000));
        id(sensor_bl0906).start_poller();              // 重启轮询器使新间隔生效
    web_server:
      sorting_group_id: diagnostic
