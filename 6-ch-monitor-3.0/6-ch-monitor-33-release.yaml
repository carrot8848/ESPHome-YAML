substitutions:
  name: "6-ch-monitor-v3_3"
  friendly_name: "6通道电量计量模块v3.3"
  ch1: "ch_1"   #可根据需要修改名称
  ch2: "ch_2"   #可根据需要修改名称
  ch3: "ch_3"   #可根据需要修改名称
  ch4: "ch_4"   #可根据需要修改名称
  ch5: "ch_5"   #可根据需要修改名称
  ch6: "ch_6"   #可根据需要修改名称
esphome:
  name: "${name}"
  name_add_mac_suffix: True
  friendly_name: "${friendly_name}"
  min_version: 2026.8.0
  project:
    name: carrot8848.6-ch-monitor
    version: "3.3"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(sensor_bl0906)->set_update_interval(static_cast<uint32_t>(id(bl0906_update_interval).state * 1000));
          id(sensor_bl0906).start_poller();
esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    # advanced:
    #   enable_ota_rollback: false
# Enable logging
logger:
  hardware_uart: UART0
  level: debug
  # 增加SPI相关的调试信息
  logs:
    sensor: warn

# Enable Home Assistant API
api:
  # reboot_timeout: 0s
# 启用preferences组件用于数据持久化
preferences:
  flash_write_interval: 5min  # 每分钟写入一次flash，平衡数据安全和flash寿命
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # power_save_mode: none
  # manual_ip:
  #   static_ip: 192.168.5.13
  #   gateway: 192.168.5.254
  #   subnet: 255.255.255.0
  #   dns1: 192.168.5.254
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    # ssid: "${name}"
    password: ""

captive_portal:
external_components:
  - source:
      type: git
      url: https://github.com/carrot8848/bl0906_carrot8848
      ref: main
    components: [bl0906_carrot8848]
    refresh: 0s
    
web_server:
  port: 80
  version: 3
  # 深度定制：自研仪表盘（6ch_dashboard.*）整体替换官方 v3 通用页面，编译进固件离线可用
  # 注意：不能开 local: True —— local 模式设备直接返回内嵌官方页面，css/js include 完全不生效
  css_url: ""   # 置空 = 不加载官方样式
  js_url: ""    # 置空 = 不加载官方前端脚本（<esp-app> 不注册，页面由我们的 js 构建）
  css_include: ../web-server-ui/energy_dashboard.css
  js_include: ../web-server-ui/energy_dashboard.js
  sorting_groups:
    - id: basic_sensors
      name: "基础传感器"
      sorting_weight: 10
    - id: current
      name: "电流"
      sorting_weight: 20
    - id: power
      name: "功率"
      sorting_weight: 30
    - id: energy
      name: "电量"
      sorting_weight: 40
    - id: sum_sensor
      name: "6通道总和"
      sorting_weight: 11
    - id: today_energy
      name: "今日电量"
      sorting_weight: 50
    - id: yesterday_energy
      name: "昨日电量"
      sorting_weight: 51
    - id: week_energy
      name: "本周电量"
      sorting_weight: 52
    - id: month_energy
      name: "本月电量"
      sorting_weight: 53
    - id: year_energy
      name: "今年电量"
      sorting_weight: 54
    - id: miscellaneous
      name: "其它"
      sorting_weight: 60
    - id: diagnostic
      name: "诊断"
      sorting_weight: 70


status_led:
  pin: GPIO2

i2c:
  sda: 10
  scl: 18
  scan: true
  frequency: 400kHz
  id: i2c_bus

spi:
  - id: spi_bus
    mosi_pin: 6
    miso_pin: 7
    clk_pin: 19
bl0906_carrot8848:
    spi_id: spi_bus
    cs_pin: 3
    id: sensor_bl0906
    update_interval: 10s
    energy_statistics: true
    time_id: my_time
    instance_id: 0x906B0001  # 手动指定实例ID
    eeprom_type: 24c02
    # EEPROM的I2C配置（独立于BL0906的SPI通信）
    i2c_id: i2c_bus
    address: 0x50
sensor:
  - platform: bl0906_carrot8848
    bl0906_carrot8848_id: sensor_bl0906

    # 全局传感器
    frequency:
      name: '2.电网频率'
      web_server:
          sorting_group_id: basic_sensors
    temperature:
      name: '3.BL0906芯片温度'
      web_server:
          sorting_group_id: basic_sensors
    voltage:
      name: '1.电网电压'
      id: bl0906_voltage
      accuracy_decimals: 1
      web_server:
          sorting_group_id: basic_sensors

    # 总和传感器
    power_sum:
      name: "1.6通道总功率"
      web_server:
          sorting_group_id: sum_sensor
    energy_sum:
      name: "2.6通道总电量"
      web_server:
          sorting_group_id: sum_sensor
      accuracy_decimals: 2
      unit_of_measurement: kWh


    # 总电量统计传感器
    today_total_energy:
      name: "3.6通道今日总电量"
      unit_of_measurement: kWh
      device_class: energy
      accuracy_decimals: 2
      web_server:
          sorting_group_id: sum_sensor
    yesterday_total_energy:
      name: "4.6通道昨日总电量"
      unit_of_measurement: kWh
      device_class: energy
      accuracy_decimals: 2
      web_server:
          sorting_group_id: sum_sensor
    week_total_energy:
      name: "5.6通道本周总电量"
      unit_of_measurement: kWh
      device_class: energy
      accuracy_decimals: 2
      web_server:
          sorting_group_id: sum_sensor
    month_total_energy:
