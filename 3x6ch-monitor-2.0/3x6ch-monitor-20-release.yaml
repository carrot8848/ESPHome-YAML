# 传感器更新间隔（运行时可调）
number:
  - platform: template
    name: "传感器更新间隔"
    id: bl0906_update_interval
    unit_of_measurement: s
    icon: "mdi:timer"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 10
    restore_value: True
    optimistic: True
    set_action:
      lambda: |-
        auto interval_ms = static_cast<uint32_t>(x * 1000);
        id(sensor_bl0906_a).set_update_interval(interval_ms);
        id(sensor_bl0906_a).start_poller();
        id(sensor_bl0906_b).set_update_interval(interval_ms);
        id(sensor_bl0906_b).start_poller();
        id(sensor_bl0906_c).set_update_interval(interval_ms);
        id(sensor_bl0906_c).start_poller();
    web_server:
      sorting_group_id: diagnostic

# 系统信息文本传感器（不包含在模板中）
text_sensor:
  - platform: version
    name: "ESPHome Version"
    icon: mdi:new-box
    web_server:
      sorting_group_id: "diagnostic"
  - platform: template
    name: "ESPHome Project Version"
    id: esphome_project_version_text_short
    icon: "mdi:information-box"
    entity_category: "diagnostic"
    update_interval: 600s
    lambda: |-
      return { ESPHOME_PROJECT_VERSION };
    web_server:
      sorting_group_id: "diagnostic"
